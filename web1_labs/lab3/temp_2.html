<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Template</title>
    <link rel="stylesheet" href="styles_2.css">
</head>
<body>
<div class="main">
    <div class="banner">
        <div class="img_temp"></div>
        <div class="banner_text">
            <p style="font-size: 30px;">Заголовок страницы</p>
            <p>Пояснительный текст</p>
        </div>
    </div>
    <div class="navigation"> <!-- Панель навигации -->
        <div>Главная</div>
        <div>Вторая</div>
        <div>Третья</div>
    </div>
    <div class="text"> <!-- Блок с информацией -->
        <div class="menu">
            <p>Меню</p>
            <a href="example.com">Ссылка 1</a><br>
            <a href="example.com">Ссылка 2</a><br>
            <a href="example.com">Ссылка 3</a><br>
        </div>
        <div class="list">
            <p style="font-size: 27px;">Список</p>
            <div class="first_element">
                <div class="img_temp"></div>
                <p style="font-size: 22px">Первый элемент</p>
                <p>Описание первого элемента</p>
            </div>
            <div class="second_element">
                <div class="img_temp"></div>
                <p style="font-size: 22px">Второй элемент</p>
                <p>Описание второго элемента</p>
            </div>
            <div class="third_element">
                <div class="img_temp"></div>
                <p style="font-size: 22px">Третий элемент</p>
                <p>Описание третьего элемента</p>
            </div>
        </div>
    </div>
    <div class="copyright"> <!-- Подвал страницы -->
        <p>&#169 Artem Petrushin 2024 Copyright</p>
        <a href="mailto:example@mail.com">Написать письмо</a>
    </div>
</div>
</body>
</html>
